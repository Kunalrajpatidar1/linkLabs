<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="popup.title">LinkLabs Quick Save</title>
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/inter.css">
    <script src="theme-bootstrap.js"></script>
    <style>
        :root {
            --ll-popup-bg: var(--ll-popup-bg-surface);
            --ll-popup-text: var(--ll-text-primary);
            --ll-popup-text-secondary: var(--ll-text-secondary);
            --ll-popup-text-muted: var(--ll-text-faint);
            --ll-popup-surface-1: var(--ll-surface-6);
            --ll-popup-surface-2: var(--ll-surface-6);
            --ll-popup-surface-3: var(--ll-surface-6);
            --ll-popup-surface-hover: var(--ll-surface-hover);
            --ll-popup-border-soft: var(--ll-border-soft);
            --ll-popup-border-muted: var(--ll-border-muted);
            --ll-popup-accent: var(--ll-accent-1);
            --ll-popup-accent-2: var(--ll-accent-2);
            --ll-popup-accent-soft: var(--ll-accent-soft);
            --ll-popup-accent-text: var(--ll-accent-active-text-color);
            --ll-popup-info: var(--ll-accent-foreground);
            --ll-popup-danger: var(--ll-danger);
            --ll-popup-warning-soft: color-mix(in srgb, var(--ll-warning) 10%, transparent);
            --ll-popup-warning-border: color-mix(in srgb, var(--ll-warning) 25%, transparent);
            --ll-popup-kbd-text: var(--ll-popup-card-text);
            --ll-popup-btn-surface: var(--ll-surface-6);
            --ll-popup-btn-surface-hover: var(--ll-surface-hover);
            --ll-popup-btn-border: var(--ll-border-soft);
            --ll-popup-btn-border-hover: var(--ll-border-accent);
            --ll-popup-save-all: var(--ll-accent-1);
            --ll-popup-spinner: var(--ll-popup-card-text);
            --ll-popup-accent-shadow-sm: rgba(var(--ll-accent-rgb), 0.22);
            --ll-popup-accent-shadow-md: rgba(var(--ll-accent-rgb), 0.32);
            --ll-popup-save-shadow-sm: rgba(var(--ll-accent-rgb), 0.28);
            --ll-popup-save-shadow-lg: rgba(var(--ll-accent-rgb), 0.45);
            --ll-popup-accent-glow: rgba(var(--ll-accent-rgb), 0.4);
            --ll-popup-danger-glow: color-mix(in srgb, var(--ll-danger) 40%, transparent);
            --ll-popup-info-glow: var(--ll-popup-accent-glow);
            --ll-popup-select-option-bg: var(--ll-dropdown-bg-color);
        }

        :root {
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 300px;
            font-family: var(--ll-font-family);
            background: var(--ll-popup-bg);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            color: var(--ll-popup-text);
            padding: 20px;
        }

        button,
        input,
        select,
        textarea,
        kbd,
        code,
        samp,
        pre {
            font-family: inherit;
            font-synthesis-weight: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: var(--ll-popup-surface-1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ll-popup-border-muted);
            border-radius: 10px;
        }


        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .page-info {
            background: var(--ll-popup-surface-2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ll-popup-border-soft);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .page-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--ll-popup-text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .page-url {
            font-size: 11px;
            color: var(--ll-popup-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--ll-popup-accent) 0%, var(--ll-popup-accent-2) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ll-border-accent, var(--ll-popup-border-soft));
            border-radius: 10px;
            color: var(--ll-popup-accent-text);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: start;
            gap: 10px;
            box-shadow: 0 4px 16px var(--ll-popup-accent-shadow-sm);
        }

        .save-btn:hover {
            background: linear-gradient(135deg, var(--ll-accent-hover, var(--ll-popup-accent)) 0%, var(--ll-popup-accent) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--ll-popup-accent-shadow-md);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .save-btn.saving {
            background: var(--ll-popup-surface-3);
            color: var(--ll-popup-card-text);
            opacity: 1;
            box-shadow: none;
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            display: block;
            flex-shrink: 0;
        }

        .btn-icon-slot {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-label {
            display: inline-flex;
            align-items: center;
        }

        /* States */
        .state {
            display: none;
            text-align: center;
        }

        .state.active {
            display: block;
        }

        /* Auth visibility must not keep the initial panel open after a result. */
        .state:not(.active) {
            display: none !important;
        }

        .state-icon-container {
            margin-bottom: 12px;
        }

        .state-icon {
            width: 48px;
            height: 48px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .message {
            font-size: 13px;
            color: var(--ll-popup-text-secondary);
        }

        .page-name {
            font-size: 12px;
            color: var(--ll-popup-info);
            font-weight: 500;
            margin-top: 4px;
        }

        .success .state-icon {
            color: var(--ll-popup-info);
        }

        .error .state-icon {
            color: var(--ll-popup-danger);
        }

        .divider {
            height: 1px;
            background: var(--ll-popup-surface-hover);
            margin: 12px 0;
        }

        .save-all-btn {
            background: linear-gradient(135deg, var(--ll-popup-save-all) 0%, var(--ll-popup-accent-2) 100%);
            border-color: var(--ll-border-accent, var(--ll-popup-border-soft));
            color: var(--ll-popup-accent-text);
            box-shadow: 0 6px 18px var(--ll-popup-save-shadow-sm);
            justify-content: flex-start;
            gap: 10px;
        }

        .save-all-btn:hover {
            box-shadow: 0 6px 18px var(--ll-popup-save-shadow-lg)
        }

        .save-all-btn .btn-label {
            flex: 1 1 auto;
            justify-content: flex-start;
        }

        .tab-count {
            background: none;
            padding: 0;
            border-radius: 0;
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-left: auto;
            color: inherit;
            line-height: 1;
        }

        /* Save All Success State */
        .save-all-success .state-icon {
            color: var(--ll-popup-info);
        }

        .saved-count {
            font-size: 24px;
            font-weight: 700;
            color: var(--ll-popup-info);
            margin-bottom: 4px;
        }

        .header, .page-info, .state.success, .state.error, .state.save-all-success {
            --ll-popup-text: var(--ll-popup-card-text);
            --ll-popup-text-secondary: var(--ll-popup-card-text-secondary);
            --ll-popup-info: var(--ll-popup-card-accent-foreground);
            color: var(--ll-popup-text);
        }

        /* Settings Section */
        .settings-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--ll-popup-border-soft);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .setting-row+.setting-row {
            margin-top: 10px;
        }

        .setting-label {
            font-size: 11px;
            color: var(--ll-popup-text-secondary);
        }

        .setting-select {
            flex: 1;
            max-width: 140px;
            padding: 6px 8px;
            font-size: 11px;
            background: var(--ll-dropdown-bg-surface);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ll-popup-border-soft);
            border-radius: 8px;
            color: var(--ll-dropdown-text);
            cursor: pointer;
            color-scheme: dark;
        }

        .setting-select option {
            background-color: var(--ll-popup-select-option-bg);
            color: var(--ll-dropdown-text);
        }

        :root[data-theme="light"] .setting-select {
            color-scheme: light;
        }

        .setting-select:focus {
            outline: none;
            border-color: var(--ll-popup-accent);
        }

        .shortcut-setting {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .setting-kbd {
            background: var(--ll-popup-surface-3);
            border: 1px solid var(--ll-popup-border-soft);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: var(--ll-font-family);
            font-size: 11px;
            color: var(--ll-popup-kbd-text);
            min-width: 66px;
            text-align: center;
        }

        .setting-btn {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--ll-popup-kbd-text);
            background: var(--ll-popup-btn-surface);
            border: 1px solid var(--ll-popup-btn-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .setting-btn:hover {
            background: var(--ll-popup-btn-surface-hover);
            border-color: var(--ll-popup-btn-border-hover);
        }

        .setting-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .setting-note {
            margin-top: 8px;
            font-size: 10px;
            color: var(--ll-popup-text-muted);
            text-align: right;
            line-height: 1.4;
        }

        /* Sync Status Banner */
        .sync-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin: -20px -20px 16px -20px;
            background: var(--ll-popup-warning-soft);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--ll-popup-warning-border);
            font-size: 12px;
        }

        .sync-banner.visible {
            display: flex;
        }

        .sync-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .sync-text {
            color: var(--ll-popup-text);
            flex: 1;
        }

        .sign-in-link {
            color: var(--ll-popup-accent);
            text-decoration: none;
            font-weight: 500;
            white-space: nowrap;
        }

        .sign-in-link:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            display: block;
            border: 2px solid var(--ll-popup-border-soft);
            border-top-color: var(--ll-popup-spinner);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* State backgrounds with glass effect */
        .state.success,
        .state.error,
        .state.save-all-success {
            padding: 20px;
            background: var(--ll-popup-surface-1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ll-popup-border-muted);
            border-radius: 12px;
        }

        .success .state-icon-container svg {
            filter: drop-shadow(0 0 8px var(--ll-popup-accent-glow));
        }

        .error .state-icon-container svg {
            filter: drop-shadow(0 0 8px var(--ll-popup-danger-glow));
        }

        .save-all-success .state-icon-container svg {
            filter: drop-shadow(0 0 8px var(--ll-popup-info-glow));
        }
        :root[dir="rtl"] body {
            direction: ltr;
        }

        :root[dir="rtl"] input[type="url"],
        :root[dir="rtl"] input[type="email"],
        :root[dir="rtl"] .url,
        :root[dir="rtl"] .email {
            direction: ltr;
            unicode-bidi: isolate;
        }
    </style>
</head>

<body>
    <!-- Initial State - Show save button -->
    <div id="initialState" class="state active">
        <div class="header">
            <span class="header-title" data-i18n="popup.header">Save to LinkLabs</span>
        </div>

        <div class="page-info">
            <div class="page-title" id="pageTitle" data-i18n="common.loading">Loading...</div>
            <div class="page-url" id="pageUrl"></div>
        </div>

        <button class="save-btn" id="saveBtn">
            <span class="btn-icon-slot" id="saveBtnIcon" aria-hidden="true">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="7" x2="12" y2="13"></line>
                    <line x1="9" y1="10" x2="15" y2="10"></line>
                </svg>
            </span>
            <span class="btn-label" id="saveBtnLabel" data-i18n="popup.save">Save to Bookmarks</span>
        </button>

        <div class="divider"></div>

        <button class="save-btn save-all-btn" id="saveAllBtn">
            <span class="btn-icon-slot" id="saveAllBtnIcon" aria-hidden="true">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
            </span>
            <span class="btn-label" id="saveAllBtnLabel" data-i18n="popup.saveAll">Save All Tabs</span>
            <span class="tab-count" id="tabCount"></span>
        </button>

        <div class="settings-section">
            <div class="setting-row">
                <span class="setting-label" data-i18n="popup.saveToPage">Save to page:</span>
                <select id="quickSavePage" class="setting-select">
                    <option value="current" data-i18n="popup.currentPage">Current Page</option>
                </select>
            </div>
            <div class="setting-row">
                <span class="setting-label" data-i18n="popup.shortcut">Shortcut:</span>
                <div class="shortcut-setting">
                    <kbd class="setting-kbd" id="quickSaveShortcutValue" data-i18n="common.loading">Loading...</kbd>
                    <button type="button" class="setting-btn" id="changeShortcutBtn"
                        data-i18n="common.change">Change</button>
                </div>
            </div>
            <div class="setting-note" id="shortcutSettingNote" data-i18n="popup.shortcutNote">Manage shortcut in browser
                settings.</div>
        </div>
    </div>

    <!-- Success State -->
    <div id="successState" class="state success">
        <div class="state-icon-container">
            <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="9 12 12 15 16 10"></polyline>
            </svg>
        </div>
        <div class="title" data-i18n="popup.success.title">Saved!</div>
        <div class="message" data-i18n="popup.success.message">Added to Quick Saved board on</div>
        <div class="page-name" id="pageName"></div>
    </div>

    <!-- Already Saved State -->
    <div id="alreadyState" class="state success">
        <div class="state-icon-container">
            <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="9 12 12 15 16 10"></polyline>
            </svg>
        </div>
        <div class="title" data-i18n="popup.already.title">Already Saved</div>
        <div class="message" data-i18n="popup.already.message">This page is already in your bookmarks</div>
    </div>

    <!-- Save All Success State -->
    <div id="saveAllSuccessState" class="state save-all-success">
        <div class="state-icon-container">
            <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
        </div>
        <div class="saved-count" id="savedTabCount">0</div>
        <div class="title" data-i18n="popup.saveAllSuccess.title">Tabs Saved!</div>
        <div class="message" data-i18n="popup.saveAllSuccess.message">Added to Quick Saved board on</div>
        <div class="page-name" id="saveAllPageName"></div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="state error">
        <div class="state-icon-container">
            <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        </div>
        <div class="title" data-i18n="popup.error.title">Cannot Save</div>
        <div class="message" id="errorMessage"></div>
    </div>

    <script src="localization-packs.js"></script>
    <script src="localization.js"></script>
    <script src="popup.js"></script>
</body>

</html>
